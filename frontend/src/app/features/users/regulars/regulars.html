<div class="table-wrapper">
  <div class="card table-container">
<!--    <div class="table-header">-->
<!--      <h2>Admin Management</h2>-->
<!--      <button pButton label="New Admin" icon="pi pi-plus" (click)="showAddAdminDialog()"></button>-->
<!--    </div>-->

    <p-table [value]="regulars()" [rows]="10" [paginator]="true" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Badge</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-admin>
        <tr>
          <td>{{admin.username}}</td>
          <td>{{admin.email}}</td>
          <td>
            <span *ngIf="admin.badge=='DOCKER_OFFICIAL_IMAGE'" class="official-badge">Docker Official Image</span>
            <span *ngIf="admin.badge=='VERIFIED_PUBLISHER'" class="verified-badge">Verified Publisher</span>
            <span *ngIf="admin.badge=='SPONSORED_OSS'" class="sponsored-badge">Sponsored OSS</span>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
