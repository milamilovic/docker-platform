<p-table [value]="regulars()" [rows]="10" [paginator]="true" responsiveLayout="scroll">
  <ng-template pTemplate="header">
    <tr>
      <th>Username</th>
      <th>Email</th>
      <th>Badge</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-admin>
    <tr>
      <td>{{admin.username}}</td>
      <td>{{admin.email}}</td>
      <td>
        <p-select
          [options]="badgeOptions"
          [(ngModel)]="admin.badge"
          optionLabel="label"  optionValue="value"  placeholder="Select a Badge"
          (onChange)="onBadgeChange(admin)"
          appendTo="body">

          <ng-template pTemplate="selectedItem" let-selectedOption>
            <span [class]="getBadgeClass(selectedOption.value)">
                {{ selectedOption.label }}
            </span>
          </ng-template>
          <ng-template let-option pTemplate="item">
            <span [class]="getBadgeClass(option.value)">{{ option.label }}</span>
          </ng-template>
        </p-select>
      </td>
    </tr>
  </ng-template>
</p-table>
<p-toast/>
